; Bluetooth IR adapter for Multimeter Viewer.
; Build and flash: `pio run -e esp32dev -t upload` (or another env below).
; The IR pins can be changed per board with the build flags.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

[env:esp32dev]
board = esp32dev
build_flags = -DIR_TX_PIN=17 -DIR_RX_PIN=16

; C3, S3 and C6 also offer the USB mode: ARDUINO_USB_CDC_ON_BOOT makes the
; chip's USB Serial/JTAG controller `Serial`, the link to the app over USB.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = -DIR_TX_PIN=4 -DIR_RX_PIN=5 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = -DIR_TX_PIN=17 -DIR_RX_PIN=18 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; The ESP32-C6 needs the Arduino core 3.x, which PlatformIO's own platform
; does not ship; pioarduino is the community platform that does.
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags = -DIR_TX_PIN=1 -DIR_RX_PIN=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1